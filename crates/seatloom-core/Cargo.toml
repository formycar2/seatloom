[package]
name = "seatloom-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
nanoid = "0.4"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
# PostgreSQL persistence — pure Postgres driver, no other DB backends
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.12" }
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-serde_json-1"] }
sha2 = "0.10"
# Unix FIFO creation (mkfifo) for tmux pipe-pane mirror — v0.0.1 read path.
# SeatLoom no longer spawns CLI processes via portable-pty (superseded by
# the tmux-mirror architecture, a5998c1); the previous `portable-pty = "0.9"`
# dep has been removed along with crates/seatloom-core/src/pty/.
nix = { version = "0.29", features = ["fs"] }
